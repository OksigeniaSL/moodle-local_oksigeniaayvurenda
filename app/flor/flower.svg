<svg class="ayv-flor" xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" role="img" aria-label="Flor" data-volver="0" data-explorar="0" data-contar="0" data-quedarse="0"><style>
.ayv-flor { --f-stem:#17574c; --f-leaf:#2c7a6a; --f-leaf2:#17574c; --f-seed:#e2654c; --f-sun:#f0b43c; --f-ground:#e3d3b4; --f-soil:#efe4cf;
  --f-water:#3f8db0; --f-spark:#e9a21f; --f-word:#e2654c; --f-root:#8a6a45; --f-off:rgba(30,43,42,.32); overflow:visible }
html[data-bs-theme="dark"] .ayv-flor { --f-stem:#8fd3c1; --f-leaf:#bfe0d6; --f-leaf2:#8fd3c1; --f-ground:#2f4a43; --f-soil:#1a2e29;
  --f-water:#7cc3e0; --f-spark:#f6ce6e; --f-word:#f08a73; --f-root:#c9a77c; --f-off:rgba(236,228,212,.34) }
.ayv-flor .mark { fill:none; stroke:var(--f-off); stroke-width:1.3; stroke-dasharray:2 2.4; transition:fill .4s, stroke .4s }
.ayv-flor .root.mark { stroke-width:2.2 }
.ayv-flor[data-volver="1"] .v1, .ayv-flor[data-volver="2"] :is(.v1,.v2), .ayv-flor[data-volver="3"] :is(.v1,.v2,.v3) { fill:var(--f-water); stroke:none }
.ayv-flor[data-explorar="1"] .e1, .ayv-flor[data-explorar="2"] :is(.e1,.e2), .ayv-flor[data-explorar="3"] :is(.e1,.e2,.e3) { fill:var(--f-spark); stroke:none }
.ayv-flor[data-contar="1"] .c1, .ayv-flor[data-contar="2"] :is(.c1,.c2), .ayv-flor[data-contar="3"] :is(.c1,.c2,.c3) { fill:var(--f-word); stroke:none }
.ayv-flor[data-quedarse="1"] .q1, .ayv-flor[data-quedarse="2"] :is(.q1,.q2), .ayv-flor[data-quedarse="3"] :is(.q1,.q2,.q3) { stroke:var(--f-root); stroke-dasharray:none }
.ayv-flor .plant { transform-origin:0 38px; animation:ayv-sway 6s ease-in-out infinite }
.ayv-flor .e1, .ayv-flor .e2, .ayv-flor .e3 { transform-box:fill-box; transform-origin:center; animation:ayv-twinkle 3.2s ease-in-out infinite }
.ayv-flor .e2 { animation-delay:-1.1s } .ayv-flor .e3 { animation-delay:-2.2s }
@keyframes ayv-sway { 0%, 100% { transform:rotate(-1.6deg) } 50% { transform:rotate(1.6deg) } }
@keyframes ayv-twinkle { 0%, 100% { transform:scale(1) } 50% { transform:scale(.82) } }
@media (prefers-reduced-motion: reduce) { .ayv-flor .plant, .ayv-flor [class^="e"] { animation:none } }
