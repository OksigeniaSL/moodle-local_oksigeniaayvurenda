.ayv-cielo.sobrio .ln { stroke-width:.8 } .ayv-cielo.sobrio .moon-sea { display:none }
.ayv-cielo:not(.sobrio) .st.on { animation:ayv-glint 4s ease-in-out infinite }
@keyframes ayv-glint { 0%, 100% { opacity:1 } 50% { opacity:.72 } }
@media (prefers-reduced-motion: reduce) { .ayv-cielo .st { animation:none !important } }
