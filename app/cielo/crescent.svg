<svg class="ayv-cielo" xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" role="img" aria-label="Creciente" data-volver="0" data-explorar="0" data-contar="0" data-quedarse="0"><style>
.ayv-cielo { --s-night:#0f3a33; --s-rim:#1f5248; --s-star:#f6ce6e; --s-off:rgba(236,228,212,.30); --s-line:rgba(246,206,110,.6);
  --s-fig:rgba(236,228,212,.13); --s-fig-on:rgba(246,206,110,.42); --s-dust:rgba(236,228,212,.35); --s-moon:#f2ead8; --s-sea:#d9cdb3 }
